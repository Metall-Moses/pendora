# Noctalia Shell Configuration for Pendora
# Declarative theme and shell settings

[theme]
mode = "dark"
source = "custom"
custom_palette = "Pendora"

[bar.default]
position = "top"

[wallpaper]
enabled = true
fill_mode = "crop"

[wallpaper.default]
path = "/usr/share/backgrounds/pendora/wallpaper.svg"
