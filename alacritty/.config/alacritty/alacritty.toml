general.import = [
  "~/.config/alacritty/catppuccin-macchiato.toml"
]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 1.0

dynamic_title = true

[font]
size = 11.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[cursor]
style = {
  shape = "Underline",
  blinking = "On"
}

[mouse]
hide_when_typing = true

[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }
