general.import = [
  "~/.config/alacritty/catppuccin-macchiato.toml"
]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.9

dynamic_title = true

[cursor]
style = {
  shape = "Underline",
  blinking = "On"
}

[mouse]
hide_when_typing = true

[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }
