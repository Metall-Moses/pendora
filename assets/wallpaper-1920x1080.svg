<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Deep Midnight Gradient -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1c30" />
      <stop offset="45%" stop-color="#09111c" />
      <stop offset="85%" stop-color="#05090f" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Subtle Fedora Abstract Geometric Facet Gradients -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51A2DA" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#294172" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58E1FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0c1626" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c6eb4" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#05090f" stop-opacity="0" />
    </linearGradient>

    <!-- Central Atmospheric Core Glow -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#51A2DA" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#2c558c" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#09111c" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#09111c" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Background: Sleek Deep Midnight Navy Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182d4d" />
      <stop offset="45%" stop-color="#101e33" />
      <stop offset="100%" stop-color="#0b1422" />
    </linearGradient>

    <!-- Shield Border Gradient: Clean Fedora Cyan to Mid-Blue -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58E1FF" />
      <stop offset="40%" stop-color="#51A2DA" />
      <stop offset="80%" stop-color="#3c6eb4" />
      <stop offset="100%" stop-color="#2a528a" />
    </linearGradient>

    <!-- Fedora 'P' Ribbon Gradient -->
    <linearGradient id="pRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72e4ff" />
      <stop offset="28%" stop-color="#51A2DA" />
      <stop offset="70%" stop-color="#3877c9" />
      <stop offset="100%" stop-color="#255ba4" />
    </linearGradient>

    <!-- Crossbar: Crisp White with subtle Cyan Sheen -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f0faff" />
      <stop offset="100%" stop-color="#d4f1ff" />
    </linearGradient>

    <!-- Subtle Ambient Core Glow behind Monogram inside Shield -->
    <radialGradient id="subtleGlow" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#51A2DA" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#2a528a" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0b1422" stop-opacity="0" />
    </radialGradient>

    <!-- Desktop Wallpaper Shield Soft Drop Shadow (1080p scale) -->
    <filter id="wallpaperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00e5ff" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. 1080p WALLPAPER CANVAS BACKDROP                        -->
  <!-- ======================================================== -->

  <!-- Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgVignette)" />

  <!-- Subtle Fedora-Style Geometric Facets (Abstract Tech Planes) -->
  <polygon points="0,0 1050,0 600,700 0,450" fill="url(#facet1)" />
  <polygon points="900,0 1920,0 1920,550 1200,450" fill="url(#facet2)" />
  <polygon points="0,600 800,400 1100,1080 0,1080" fill="url(#facet3)" />
  <polygon points="1050,550 1920,325 1920,1080 800,1080" fill="url(#facet1)" />

  <!-- Central Atmosphere Radial Luminescence -->
  <circle cx="960" cy="540" r="480" fill="url(#centerAura)" />

  <!-- ======================================================== -->
  <!-- 2. CENTER EMBLEM (Scale: 0.78x, Centered at 960, 540)     -->
  <!-- ======================================================== -->
  <!-- Transform: translate(960 - 256*0.78, 540 - 256*0.78)     -->
  <!-- 960 - 199.68 = 760.32,  540 - 199.68 = 340.32            -->
  <g transform="translate(760.32, 340.32) scale(0.78)" filter="url(#wallpaperShadow)">

    <!-- Outer Security Shield -->
    <path d="M 256, 44
             C 374, 44 436, 80 436, 184
             C 436, 316 340, 412 256, 466
             C 172, 412 76, 316 76, 184
             C 76, 80 138, 44 256, 44 Z"
          fill="url(#shieldBg)"
          stroke="url(#shieldBorder)"
          stroke-width="5.5"
          stroke-linejoin="round" />

    <!-- Shield Inner Accent Line -->
    <path d="M 256, 56
             C 362, 56 422, 88 422, 184
             C 422, 304 332, 396 256, 448
             C 180, 396 90, 304 90, 184
             C 90, 88 150, 56 256, 56 Z"
          fill="none"
          stroke="#51A2DA"
          stroke-width="1.5"
          opacity="0.3" />

    <!-- Soft Ambient Glow behind the P -->
    <circle cx="256" cy="245" r="130" fill="url(#subtleGlow)" />

    <!-- 1. The 'P' Ribbon (Continuous Stem + Bowl) -->
    <path d="M 206, 356
             L 206, 148
             L 252, 148
             C 292, 148 322, 172 322, 202
             C 322, 232 292, 256 252, 256
             L 206, 256"
          fill="none"
          stroke="url(#pRibbon)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 2. Iconic Fedora Crossbar Element -->
    <rect x="156" y="194" width="94" height="16" rx="8"
          fill="url(#crossbarGrad)" />

  </g>

</svg>
