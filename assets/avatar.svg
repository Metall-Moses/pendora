<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Avatar Canvas Dark Blue Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#16273f" />
      <stop offset="50%" stop-color="#0c1624" />
      <stop offset="85%" stop-color="#060b13" />
      <stop offset="100%" stop-color="#03060a" />
    </radialGradient>

    <!-- Ambient Shading Aura behind Shield -->
    <radialGradient id="shieldAura" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#51A2DA" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#2c5282" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#060b13" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Background: Sleek Deep Midnight Navy Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182d4d" />
      <stop offset="45%" stop-color="#101e33" />
      <stop offset="100%" stop-color="#0b1422" />
    </linearGradient>

    <!-- Shield Border Gradient: Clean Fedora Cyan to Mid-Blue -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58E1FF" />
      <stop offset="40%" stop-color="#51A2DA" />
      <stop offset="80%" stop-color="#3c6eb4" />
      <stop offset="100%" stop-color="#2a528a" />
    </linearGradient>

    <!-- Fedora 'P' Ribbon Gradient -->
    <linearGradient id="pRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72e4ff" />
      <stop offset="28%" stop-color="#51A2DA" />
      <stop offset="70%" stop-color="#3877c9" />
      <stop offset="100%" stop-color="#255ba4" />
    </linearGradient>

    <!-- Crossbar: Crisp White with subtle Cyan Sheen -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f0faff" />
      <stop offset="100%" stop-color="#d4f1ff" />
    </linearGradient>

    <!-- Subtle Ambient Core Glow behind Monogram inside Shield -->
    <radialGradient id="subtleGlow" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#51A2DA" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#2a528a" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0b1422" stop-opacity="0" />
    </radialGradient>

    <!-- Multi-stage Shading & Drop Shadow behind Shield -->
    <filter id="shieldElevation" x="-25%" y="-25%" width="150%" height="150%">
      <!-- Deep dark occlusion shadow -->
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <!-- Subtle ambient cyan back-glow -->
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#51A2DA" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. DARK BLUE AVATAR CANVAS BACKDROP                       -->
  <!-- ======================================================== -->
  <rect width="512" height="512" rx="96" fill="url(#avatarBg)" />

  <!-- Ambient Shading & Luminescence directly behind Shield -->
  <circle cx="256" cy="250" r="220" fill="url(#shieldAura)" />

  <!-- ======================================================== -->
  <!-- 2. ELEVATED SECURITY SHIELD WITH AMBIENT SHADOW           -->
  <!-- ======================================================== -->
  <g filter="url(#shieldElevation)">
    <!-- Outer Security Shield -->
    <path d="M 256, 44
             C 374, 44 436, 80 436, 184
             C 436, 316 340, 412 256, 466
             C 172, 412 76, 316 76, 184
             C 76, 80 138, 44 256, 44 Z"
          fill="url(#shieldBg)"
          stroke="url(#shieldBorder)"
          stroke-width="5.5"
          stroke-linejoin="round" />

    <!-- Shield Inner Accent Line -->
    <path d="M 256, 56
             C 362, 56 422, 88 422, 184
             C 422, 304 332, 396 256, 448
             C 180, 396 90, 304 90, 184
             C 90, 88 150, 56 256, 56 Z"
          fill="none"
          stroke="#51A2DA"
          stroke-width="1.5"
          opacity="0.3" />

    <!-- Soft Ambient Glow behind the P -->
    <circle cx="256" cy="245" r="130" fill="url(#subtleGlow)" />

    <!-- 1. The 'P' Ribbon (Continuous Stem + Bowl) -->
    <path d="M 206, 356
             L 206, 148
             L 252, 148
             C 292, 148 322, 172 322, 202
             C 322, 232 292, 256 252, 256
             L 206, 256"
          fill="none"
          stroke="url(#pRibbon)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 2. Iconic Fedora Crossbar Element -->
    <rect x="156" y="194" width="94" height="16" rx="8"
          fill="url(#crossbarGrad)" />
  </g>

</svg>
